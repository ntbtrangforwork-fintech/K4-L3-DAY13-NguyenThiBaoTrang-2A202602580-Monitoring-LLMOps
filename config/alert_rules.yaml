alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602580
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602580
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: mean(response_sent.quality_score) < 0.75
    duration: 10m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602580
    runbook: docs/alerts.md#alert-3
